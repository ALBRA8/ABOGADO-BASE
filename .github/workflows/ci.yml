name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Permite certificar un commit exacto de un branch de feature:
  # gh api repos/ALBRA8/ABOGADO-BASE/actions/workflows/ci.yml/dispatches \
  #   -f ref=<branch>   →  el run corre sobre github.sha = head del branch.
  workflow_dispatch:

# CI corre sobre el commit exacto que se está evaluando (github.sha)
# El clean-room job clona específicamente ese commit, no main ambiguamente.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Packaging smoke — console script entrypoint
        # Evidencia de packaging: el entrypoint declarado en
        # [project.scripts] (albra = "albra.cli:cli_entry") se registra
        # y ejecuta en una instalación real.
        run: |
          albra --version
          python -c "from importlib.metadata import entry_points; eps=[e for e in entry_points(group='console_scripts') if e.name=='albra']; assert eps and eps[0].value=='albra.cli:cli_entry', eps; print('console-script OK:', eps[0].value)"
      - name: Lint (fail-on-error)
        run: |
          ruff check albra/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run all tests (fail-on-error)
        env:
          # CI inyecta secretos efímeros pero fuertes para tests.
          # NO son defaults operativos - solo para CI.
          ALBRA_JWT_SECRET: ci-ephemeral-jwt-secret-not-for-production-32chars
          ALBRA_ADMIN_PASSWORD: ci-ephemeral-admin-pass-1234
        run: |
          pytest -v --tb=short

  clean-room:
    # Clean-room verification: clona el commit exacto que se certifica,
    # no main ambiguamente. Esto garantiza que la evidencia reproducible
    # corresponde al commit bajo evaluacion.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean-room verification on commit ${{ github.sha }}
        env:
          ALBRA_JWT_SECRET: ci-ephemeral-jwt-secret-not-for-production-32chars
          ALBRA_ADMIN_PASSWORD: ci-ephemeral-admin-pass-1234
        run: |
          echo "=== Clean-room verification on commit ${{ github.sha }} ==="
          git clone https://github.com/ALBRA8/ABOGADO-BASE.git fresh
          cd fresh
          git checkout ${{ github.sha }}
          echo "=== Verified commit ==="
          git log --oneline -1
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"
          echo "=== Lint ==="
          ruff check albra/ tests/ src/
          echo "=== Tests ==="
          pytest -v --tb=short
          echo "=== Module import smoke ==="
          python -c "from albra.identity.agent import Agent; from albra.lawyer.exam import LawyerExam; from albra.knowledge.colombia.corpus_pilot.real_corpus_v14 import ALL_DOCUMENTS_V14; print(f'ABOGADO-BASE modules OK — corpus {len(ALL_DOCUMENTS_V14)} docs')"
          echo "=== Clean-room PASS on commit ${{ github.sha }} ==="
